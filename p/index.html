<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manifest | Check-in Pass</title>
<meta name="description" content="Verified skydiver check-in pass: license, jumps, currency and gear service, proven by Manifest." />
<meta name="theme-color" content="#0F0F12" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/app-icon.png?v=3" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>@font-face{font-family:"Geist";font-style:normal;font-weight:100 900;font-display:swap;src:url(/assets/fonts/geist-variable.woff2) format("woff2")}</style>
<style>
  /* THE APP'S DARK LOOK (13 Oct 2026, André: "dark and same purple, match it").
     Page #0F0F12, cards #1A1B1F, the hero is the app's own glow image (the one
     brand purple #B2A4F9 into the page), white and light grey text only,
     status in Apple's green, yellow and red as a dot on a neutral chip. */
  :root { --page:#0F0F12; --card:#1A1B1F; --raised:#2A2B31; --line:#2A2B31; --ink:#FFFFFF; --muted:#D1D1D6;
          --green:#30D158; --yellow:#FFD60A; --red:#FF453A; --grey:#8E8E93; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:var(--page); color-scheme:dark; }
  body { font-family:'Geist',-apple-system,sans-serif; background:var(--page); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; }
  .wrap { width:100%; max-width:420px; }
  .state { text-align:center; padding:60px 20px; color:var(--muted); }
  .spinner { width:34px; height:34px; border:3px solid var(--raised); border-top-color:#B2A4F9; border-radius:50%;
    margin:0 auto 16px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .card { background:var(--card); border-radius:24px; overflow:hidden; }
  /* The in-app pass band exactly: brandMix(0.3) to brandMix(0.55), corner to corner (André, 13 Oct). */
  .band { position:relative; color:#fff; padding:22px 22px 20px; background:linear-gradient(to bottom right, #403C57, #696191); }
  .band-top { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:8px; }
  .tag { font-size:11px; font-weight:800; letter-spacing:1.4px; color:#fff; }
  /* Photo + name on one row: the desk checks the face against the person. */
  .idrow { display:flex; align-items:center; gap:14px; margin-top:16px; }
  .idrow .who { min-width:0; }
  .face { width:64px; height:64px; border-radius:16px; flex:none; object-fit:cover; background:var(--raised); }
  .face-ph { width:64px; height:64px; border-radius:16px; flex:none; display:flex; align-items:center;
             justify-content:center; font-size:26px; font-weight:800; color:#fff; background:var(--raised); }
  .name { font-size:27px; font-weight:800; letter-spacing:-.5px; display:flex; align-items:center; gap:8px; }
  .home { font-size:13.5px; font-weight:600; color:var(--muted); margin-top:2px; }
  .badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .pill { background:rgba(255,255,255,.14); color:#fff; font-size:12.5px; font-weight:700; padding:5px 12px; border-radius:999px; }
  .pill.lic { background:#fff; color:#050505; }
  .member { font-size:13.5px; color:var(--muted); margin-top:12px; }
  .member-sub { font-size:12px; color:var(--muted); margin-top:3px; }
  .status { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 22px; border-bottom:1px solid var(--line); }
  .status .s { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; letter-spacing:.3px; color:#fff; }
  .status .s .dot { width:9px; height:9px; }
  .status .ss { font-size:12.5px; color:var(--muted); text-align:right; }
  .stats { display:flex; padding:18px 22px; }
  .stat { flex:1; text-align:center; }
  .stat .v { font-size:28px; font-weight:800; color:#fff; }
  .stat .l { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .statsub { font-size:11px; color:var(--muted); margin-top:1px; letter-spacing:.2px; }
  .sep { width:1px; background:var(--line); }
  .gear { padding:6px 22px 14px; border-top:1px solid var(--line); }
  .credhead { font-size:11px; font-weight:800; letter-spacing:1.2px; color:var(--muted); padding:12px 0 2px; }
  .due { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; }
  .due + .due { border-top:1px solid var(--line); }
  .due .l { font-size:14.5px; font-weight:600; color:#fff; min-width:0; }
  .due .r { display:flex; align-items:center; gap:9px; flex:none; }
  .due .d { font-size:13px; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:#fff;
          background:var(--raised); padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; flex:none; }
  .due .l .sub { display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:2px; }
  .foot { text-align:center; margin-top:18px; font-size:12.5px; color:var(--muted); line-height:1.55; }
  .foot strong { color:#fff; }
  /* Documents (v135, one-tap download 8 Nov 2026): straight under the status, one white button. */
  .docs { padding:6px 22px 18px; border-bottom:1px solid var(--line); }
  .docs .sub2 { font-size:13.5px; color:var(--muted); margin:4px 0 2px; line-height:1.5; }
  .docs .sub2 strong { color:#fff; font-weight:700; }
  .doc { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; }
  .doc + .doc { border-top:1px solid var(--line); }
  .doc .l { font-size:14.5px; font-weight:600; color:#fff; min-width:0; }
  .doc .l .sub { display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:2px; }
  .doc .r { display:flex; gap:14px; flex:none; }
  .doc a { color:#fff; font-weight:700; font-size:13.5px; text-decoration:underline; }
  .docbtn { display:block; text-align:center; margin-top:12px; background:#fff; color:#050505; text-decoration:none;
    border-radius:999px; padding:14px 18px; font-weight:700; font-size:15.5px; }
  .docbtn.wait { opacity:.55; pointer-events:none; }
  .doclink { display:block; margin:10px auto 0; background:none; border:0; color:var(--muted); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; }
  .docmail { display:none; gap:8px; margin-top:10px; }
  .docmail.on { display:flex; }
  .docmail input { flex:1; min-width:0; border-radius:12px; border:1px solid var(--line); background:transparent; color:inherit; padding:11px 12px; font:inherit; font-size:16px; }
  .docsend { border:0; border-radius:12px; padding:0 16px; background:var(--raised); color:#fff; font:inherit; font-weight:700; font-size:14.5px; cursor:pointer; }
  .docnote { font-size:12.5px; color:var(--muted); text-align:center; margin-top:8px; min-height:0; }
  .docnote:empty { display:none; }
  .getlink { display:inline-block; margin-top:10px; color:#fff; font-weight:600; font-size:13px; }
</style>
<style id="lockup-css">img.lockup{aspect-ratio:10747/2250} img[src*="appstore-badge.svg"]{aspect-ratio:135/40} /* One logo file: the M centred on the lowercase letters, reaching above and below (2 Oct 2026). */ img.lockup{height:32px!important;width:auto!important;border-radius:0!important;display:block;max-width:none!important} @media (max-width:600px){img.lockup{height:29px!important}} .brand img.lockup{height:21px!important} .hub-wordmark img.lockup{height:22px!important}</style>
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Manifest" />
<meta property="og:title" content="A Check-in Pass on Manifest" />
<meta property="og:description" content="Licence, currency, jumps and gear service on one scannable pass, straight from Manifest." />
<meta property="og:image" content="https://www.jumpmanifest.com/assets/og-image.png?v=11" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="A Check-in Pass on Manifest" />
<meta name="twitter:image" content="https://www.jumpmanifest.com/assets/og-image.png?v=11" />
</head>
<body>
<div class="wrap">
  <div id="root">
    <div class="state"><div class="spinner"></div>Loading pass…</div>
  </div>
</div>

<script>
  function getCode() {
    const q = new URLSearchParams(location.search).get('code');
    if (q) return q.trim();
    // Path form: /p/<code>
    const parts = location.pathname.split('/').filter(Boolean);
    const last = parts[parts.length - 1];
    if (last && last !== 'p') return last.trim();
    return null;
  }

  const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function daysBetween(iso) {
    if (!iso) return null;
    const [y,m,d] = iso.split('-').map(Number);
    if (!y) return null;
    const t = new Date(y, (m||1)-1, d||1);
    const today = new Date(); today.setHours(0,0,0,0);
    return Math.floor((t - today) / 86400000);
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const [y,m,d] = iso.split('-').map(Number);
    if (!y) return '';
    return new Date(y,(m||1)-1,d||1).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }
  function dueChip(label, iso) {
    const days = daysBetween(iso);
    let st = 'none';
    if (days != null) st = days < 0 ? 'overdue' : days <= 30 ? 'soon' : 'ok';
    const text = st==='ok'?'In date':st==='soon'?('Due in '+days+'d'):st==='overdue'?'Overdue':'Not tracked';
    return `<div class="due"><span class="l">${esc(label)}</span><span class="r"><span class="d">${esc(fmtDate(iso))}</span>
      ${chip(st, text)}</span></div>`;
  }
  // Neutral chip, status as a dot (the app's convention).
  const DOT = { ok:'var(--green)', soon:'var(--yellow)', overdue:'var(--red)', none:'var(--grey)' };
  const chip = (st, text) => `<span class="chip"><span class="dot" style="background:${DOT[st]}"></span>${esc(text)}</span>`;
  const CRED_LABEL = { license:'License', association:'Membership', insurance:'Insurance', rigger:'Rigger ticket', medical:'Medical', other:'Other' };
  function credsHtml(creds) {
    if (!Array.isArray(creds) || creds.length === 0) return '';
    const rows = creds.map((c) => {
      const days = daysBetween(c.expiry);
      let st = 'none';
      if (days != null) st = days < 0 ? 'overdue' : days <= 30 ? 'soon' : 'ok';
      const text = st==='overdue'?'Expired':st==='soon'?('Expires in '+days+'d'):st==='ok'?'Valid':'On file';
      const name = (c.title && c.title.trim()) ? c.title : (CRED_LABEL[c.type] || 'Credential');
      const meta = [c.issuer, c.number ? '#'+c.number : ''].filter(Boolean).join(' · ');
      return `<div class="due"><span class="l">${esc(name)}${meta?`<span class="sub">${esc(meta)}</span>`:''}</span><span class="r">
        ${chip(st, text)}</span></div>`;
    }).join('');
    return `<div class="gear"><div class="credhead">CREDENTIALS</div>${rows}</div>`;
  }

  // Recent jumps with their sign-off. Verified jumps (signed off by another
  // licensed jumper) are the real proof; self-logged ones are marked as such.
  function recentJumpsHtml(jumps) {
    if (!Array.isArray(jumps) || jumps.length === 0) return '';
    const rows = jumps.map((j) => {
      const disc = Array.isArray(j.disciplines) ? j.disciplines.join(', ') : '';
      const left = [fmtDate(j.date), j.dz].filter(Boolean).join(' · ');
      const lic = j.signer_license && j.signer_license !== 'none' ? ' · ' + j.signer_license : '';
      const sign = j.signed_off_by
        ? chip('ok', j.signed_off_by + lic)
        : chip('none', 'Self-logged');
      return `<div class="due"><span class="l">${esc(left)}${disc?`<span class="sub">${esc(disc)}</span>`:''}</span><span class="r">${sign}</span></div>`;
    }).join('');
    return `<div class="gear"><div class="credhead">RECENT JUMPS</div>${rows}</div>`;
  }

  // Branded card, not bare text on white. This fires at the worst possible
  // moment — a jumper standing at a desk while someone scans their code — and
  // an unstyled grey sentence is indistinguishable from a broken website.
  // Keeping the Manifest band means a failure still looks like a system.
  function showState(msg, hint) {
    document.getElementById('root').innerHTML = `
      <div class="card">
        <div class="band">
          <div class="band-top">
            <div class="brand"><img class="lockup" src="/assets/manifest-lockup-white.svg?v=6" alt="Manifest" /></div>
            <span class="tag">CHECK-IN PASS</span>
          </div>
        </div>
        <div class="state">
          <div style="font-weight:700;color:#fff;font-size:15px">${msg}</div>
          ${hint ? `<div style="margin-top:8px;line-height:1.5">${hint}</div>` : ''}
        </div>
      </div>`;
  }

  function render(p) {
    // Days SINCE the last jump: daysBetween counts forward, so flip it (it read "-5d ago").
    const ahead = daysBetween(p.last_jump);
    const since = ahead == null ? null : Math.max(0, -ahead);
    const current = since != null && since <= (p.currency_window || 90);
    const license = p.license_type && p.license_type !== 'none' ? p.license_type + ' License' : '';
    const ratings = Array.isArray(p.ratings) ? p.ratings : [];
    // License number is the credential a DZ verifies → primary (full); member
    // number is the masked private account ID → secondary, only when both exist;
    // one-number federations fall back to whichever they have. See FEATURES.md.
    // Suppress license_number when it just repeats the class letter (redundant
    // with the class badge — common for federations like NLF with no separate
    // license number); fall back to the membership number.
    const cls = p.license_type && p.license_type !== 'none' ? p.license_type : null;
    const lic = (p.license_number && cls && p.license_number.trim().toUpperCase() === cls.trim().toUpperCase()) ? null : p.license_number;
    const primaryNum = lic || p.member_number;
    const memberLine = [p.licensing_body, primaryNum ? '#'+primaryNum : ''].filter(Boolean).join(' · ');
    const memberSub = (lic && p.member_number) ? 'Member #'+p.member_number : '';
    const isFounder = p.verification === 'founder';

    document.getElementById('root').innerHTML = `
      <div class="card">
        <div class="band">
          <div class="band-top">
            <div class="brand"><img class="lockup" src="/assets/manifest-lockup-white.svg?v=6" alt="Manifest" /></div>
            <span class="tag">CHECK-IN PASS</span>
          </div>
          <div class="idrow">
            ${p.avatar_url
              ? `<img class="face" src="${esc(p.avatar_url)}" alt="" referrerpolicy="no-referrer"
                   onerror="this.outerHTML='<div class=\\'face-ph\\'>${esc((p.name || 'S').trim().charAt(0).toUpperCase())}</div>'"/>`
              : `<div class="face-ph">${esc((p.name || 'S').trim().charAt(0).toUpperCase())}</div>`}
            <div class="who">
              <div class="name">${esc(p.name || 'Skydiver')}</div>
              ${p.home_dz ? `<div class="home">${esc(p.home_dz)}</div>` : ''}
            </div>
          </div>
          <div class="badges">
            ${license ? `<span class="pill lic">${esc(license)}</span>` : ''}
            ${ratings.map(r => `<span class="pill">${esc(r)}</span>`).join('')}
            ${isFounder ? `<span class="pill">★ Founder</span>` : ''}
          </div>
          ${memberLine ? `<div class="member">${esc(memberLine)}</div>` : ''}
          ${memberSub ? `<div class="member-sub">${esc(memberSub)}</div>` : ''}
        </div>
        <div class="status">
          <span class="s"><span class="dot" style="background:${since == null ? 'var(--grey)' : current ? 'var(--green)' : 'var(--red)'}"></span>${since == null ? 'NO DATA YET' : current ? 'CURRENT' : 'NOT CURRENT'}</span>
          <span class="ss">${p.last_jump ? ('Last jump ' + (since === 0 ? 'today' : since + 'd ago') + ' · ' + (p.currency_window||90) + 'd window') : 'No jumps logged yet'}</span>
        </div>
        <div id="docs"></div>
        <div class="stats">
          <div class="stat"><div class="v">${Number(p.total_jumps||0).toLocaleString()}</div><div class="l">Total jumps</div><div class="statsub">self-logged</div></div>
          <div class="sep"></div>
          <div class="stat"><div class="v">${Number(p.verified_jumps||0).toLocaleString()}</div><div class="l">Verified</div><div class="statsub">signed off</div></div>
        </div>
        <div class="gear">
          ${dueChip('Reserve repack', p.reserve_due)}
          ${dueChip('AAD service', p.aad_due)}
        </div>
        ${credsHtml(p.credentials)}
        ${recentJumpsHtml(p.recent_jumps)}
      </div>
      <div class="foot">
        <!-- 8 Nov 2026, André: "nobody reads a book". One line, one small link. -->
        Verified jumps are signed off in person. The rest is entered by the holder.
        <br/><a class="getlink" href="/get">Get Manifest</a>
      </div>`;
  }

  // THE DOCUMENTS (v135; one-tap download 8 Nov 2026). The QR the jumper shows
  // live from the app carries ?d=<key>. The key lives 15 minutes and the app
  // swaps it once it has under 5 left, so a fresh scan is good for 5 to 15
  // minutes. The permanent code alone (a screenshot, the Wallet pass) never
  // opens files, so without a live key we say plainly what to do.
  //
  // "Download documents" is ONE real link to ONE zip, built here as soon as the
  // list arrives (fflate, from the signed links pass-docs hands back). A real
  // <a download> tapped by the user is the only multi-file download iPhone
  // Safari does not block; firing several downloads from a script loses all but
  // the first. One document skips the zip and links the file itself.
  const DOCS_FN = 'https://wkefdtglgbfprvfajrrw.supabase.co/functions/v1/pass-docs';
  const FFLATE = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
  const docKey = new URLSearchParams(location.search).get('d');
  async function docsCall(body) {
    const r = await fetch(DOCS_FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ key: docKey }, body)) });
    return r.json().catch(() => ({ error: 'Try again' }));
  }
  const docsBox = (inner) => `<div class="docs"><div class="credhead">DOCUMENTS</div>${inner}</div>`;
  // The signed link carries &download=<name> (attachment); without it the file opens in the tab.
  const viewUrl = (u) => { try { const x = new URL(u); x.searchParams.delete('download'); return x.toString(); } catch { return u; } };
  const fileName = (u, fallback) => { try { return new URL(u).searchParams.get('download') || fallback; } catch { return fallback; } };
  function loadScript(src) {
    return new Promise((ok, no) => { const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = no; document.head.appendChild(t); });
  }
  async function buildZip(docs) {
    if (!window.fflate) await loadScript(FFLATE);
    const files = {};
    const used = new Set();
    for (const x of docs) {
      const r = await fetch(x.url);
      if (!r.ok) throw new Error('fetch ' + r.status);
      let n = fileName(x.url, x.label + '.' + x.kind);
      for (let i = 2; used.has(n); i++) n = n.replace(/(\.\w+)?$/, ` ${i}$1`);
      used.add(n);
      files[n] = [new Uint8Array(await r.arrayBuffer()), { level: 0 }]; // PDFs and JPEGs are already compressed
    }
    return new Blob([window.fflate.zipSync(files)], { type: 'application/zip' });
  }
  async function loadDocs(name) {
    const box = document.getElementById('docs');
    if (!box) return;
    const again = docsBox(`<div class="sub2"><strong>Ask them to show their pass again.</strong><br/>Documents open only from a fresh scan of the pass in the Manifest app.</div>`);
    if (!docKey) { box.innerHTML = again; return; }
    box.innerHTML = docsBox(`<div class="sub2">Loading documents…</div>`);
    const d = await docsCall({ action: 'list' }).catch(() => null);
    if (!d || d.error) { box.innerHTML = docsBox(`<div class="sub2">Couldn’t load the documents. Refresh to try again.</div>`); return; }
    if (d.expired) { box.innerHTML = again; return; }
    if (!d.docs || !d.docs.length) {
      box.innerHTML = docsBox(`<div class="sub2">No documents shared on this pass.</div>`);
      return;
    }
    const n = d.docs.length;
    const rows = d.docs.map((x) => `<div class="doc"><span class="l">${esc(x.label)}${x.number ? `<span class="sub">#${esc(x.number)}</span>` : ''}</span>
      <span class="r"><a href="${esc(viewUrl(x.url))}" target="_blank" rel="noopener">View</a><a href="${esc(x.url)}" download>Download</a></span></div>`).join('');
    box.innerHTML = docsBox(`${rows}
      <a class="docbtn" id="dl-all" href="${esc(d.docs[0].url)}" download>${n === 1 ? 'Download document' : 'Download documents'}</a>
      <div class="docnote" id="doc-note">${n === 1 ? '' : 'Preparing ' + n + ' files…'}</div>
      <button class="doclink" id="mail-open" type="button">Email them to me</button>
      <form class="docmail" id="mail-form"><input type="email" id="mail-to" placeholder="you@dropzone.com" autocomplete="email" required /><button class="docsend">Send</button></form>`);
    const btn = document.getElementById('dl-all');
    const note = document.getElementById('doc-note');
    // Links die with the key: after that, say so instead of serving an error page.
    const left = new Date(d.expires_at) - Date.now();
    setTimeout(() => { box.innerHTML = again; }, Math.max(0, left));
    if (n > 1) {
      btn.classList.add('wait');
      btn.onclick = (e) => { if (btn.classList.contains('wait')) e.preventDefault(); };
      try {
        const zip = await buildZip(d.docs);
        btn.href = URL.createObjectURL(zip);
        btn.download = `${(d.name || name || 'Jumper').replace(/[\\/:*?"<>|]/g, '')} - documents.zip`;
        note.textContent = '';
      } catch (err) {
        // No zip (a blocked CDN, a failed fetch): fall back to one file after another.
        console.warn('zip', err);
        btn.onclick = (e) => {
          e.preventDefault();
          d.docs.forEach((x, i) => setTimeout(() => { const a = document.createElement('a'); a.href = x.url; a.download = ''; document.body.appendChild(a); a.click(); a.remove(); }, i * 600));
        };
        note.textContent = '';
      }
      btn.classList.remove('wait');
    }
    document.getElementById('mail-open').onclick = () => { document.getElementById('mail-form').classList.add('on'); document.getElementById('mail-to').focus(); };
    document.getElementById('mail-form').onsubmit = async (e) => {
      e.preventDefault();
      note.textContent = 'Sending…';
      const r = await docsCall({ action: 'email', email: document.getElementById('mail-to').value }).catch(() => ({ error: 'Try again' }));
      note.textContent = r.sent ? 'Sent. Check your inbox.' : r.expired ? 'Ask them to show their pass again.' : (r.error || 'Try again');
    };
  }

  (async () => {
    const code = getCode();
    if (!code) { showState('No pass code in this link.', 'The QR may have been cropped. Ask the jumper to show it again.'); return; }
    try {
      // Goes through our rate-limited proxy (/api/pass) — the Supabase key is
      // never exposed in the page.
      const res = await fetch('/api/pass?code=' + encodeURIComponent(code));
      if (res.status === 429) { showState('Too many requests.', 'Please wait a moment and try again.'); return; }
      if (!res.ok) { showState('Couldn’t load this pass.', 'Please try again in a moment.'); return; }
      const data = await res.json();
      if (!data) { showState('No pass matches this code.', 'Ask the jumper to reopen their Check-in Pass in the Manifest app for a fresh code.'); return; }
      render(data);
      loadDocs(data.name);
    } catch (e) {
      showState('Couldn’t load this pass.', 'Check your connection and try again.');
    }
  })();
</script>
<script id="safari-noshadow">/* 5 Nov 2026: Safari paints black boxes over the page (the hero, the right edge) while a drop-shadow filter sits on any image. Chrome is fine, so only Safari loses those shadows. */(function(){var u=navigator.userAgent;if(!/Safari/.test(u)||/Chrome|CriOS|FxiOS|Android/.test(u))return;function k(){document.querySelectorAll("img, picture, video, figure, .dzg-halo, [class*=phone]").forEach(function(e){if(getComputedStyle(e).filter.indexOf("drop-shadow")>-1)e.style.setProperty("filter","none","important")})}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",k);else k();addEventListener("load",k)})();</script>
