<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex" />
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Plus Jakarta Sans", -apple-system, sans-serif;
    color: #140f24; overflow: hidden;
    background:
      radial-gradient(70% 60% at 22% -10%, rgba(124,58,237,.16) 0%, rgba(124,58,237,0) 60%),
      radial-gradient(60% 60% at 110% 30%, rgba(67,56,202,.10) 0%, rgba(67,56,202,0) 60%),
      #F7F6FB;
    position: relative;
  }
  .dots { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(20,15,36,.05) 1.4px, transparent 1.4px);
    background-size: 38px 38px; opacity: .7; }
  .card { position: relative; height: 100%; padding: 84px 90px;
    display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 22px; }
  .top img { width: 92px; height: 92px; border-radius: 24px;
    box-shadow: 0 14px 40px rgba(124,58,237,.5); }
  .top .nm { font-weight: 800; font-size: 50px; letter-spacing: -.02em; }
  .pill { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start;
    font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    color: #6D28D9; background: rgba(124,58,237,.10); border: 1px solid rgba(124,58,237,.28);
    padding: 12px 24px; border-radius: 100px; margin-top: 8px; }
  .pill .dot { width: 11px; height: 11px; border-radius: 50%; background: #7C3AED; box-shadow: 0 0 14px #7C3AED; }
  h1 { font-weight: 800; font-size: 96px; line-height: 1.0; letter-spacing: -.04em; }
  h1 .accent { color: #7C3AED; }
  p { font-weight: 600; font-size: 34px; color: #6b6480; max-width: 22ch; }
  p b { color: #140f24; font-weight: 700; }
</style>
<style id="lockup-css">/* One logo file: the M centred on the lowercase letters, reaching above and below (2 Oct 2026). */ img.lockup{height:32px!important;width:auto!important;border-radius:0!important;display:block;max-width:none!important} @media (max-width:600px){img.lockup{height:29px!important}} .brand img.lockup{height:21px!important} .hub-wordmark img.lockup{height:22px!important}</style>
</head>
<body>
<div class="dots"></div>
<div class="card">
  <div>
    <div class="top">
      <img class="lockup" src="assets/manifest-lockup.svg?v=6" alt="Manifest" />
    </div>
  </div>
  <div>
    <span class="pill"><span class="dot"></span> Now in private beta</span>
    <h1 style="margin-top:24px">Log it. Verify it. <span class="accent">Prove it.</span></h1>
  </div>
  <p>The gear passport for skydivers: <b>witnessed jumps, verified gear,</b> faster check-in.</p>
</div>
<style id="btn-black">/* 21 Oct 2026 (André): no purple buttons anywhere. Every filled button is the
   black price-card button: dark gradient, white text, soft ring. Shapes stay. */
.sh-cta-demo,.fd-btn,.btn.ghost,.btn.demo,.band-btn,.pc-out,.sms-btn,.sm-btn,.pc-call,.lo-btn,.lc-btn,.hmw-btn,.dp-btn,.btn.primary,.pq-btn,a.btn[href*="apps.apple.com"],a.btn[href="/get"]{background:linear-gradient(180deg,#2A2A2E,#050505)!important;color:#fff!important;border:0!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 2px #E9E5FE!important;filter:none!important;transition:box-shadow .2s ease!important}
.sh-cta-demo:hover,.fd-btn:hover,.btn.ghost:hover,.btn.demo:hover,.band-btn:hover,.pc-out:hover,.sms-btn:hover,.sm-btn:hover,.pc-call:hover,.lo-btn:hover,.lc-btn:hover,.hmw-btn:hover,.dp-btn:hover,.btn.primary:hover,.pq-btn:hover,a.btn[href*="apps.apple.com"]:hover,a.btn[href="/get"]:hover{background:linear-gradient(180deg,#3A3A3F,#0A0A0A)!important;color:#fff!important;transform:none!important}
.sh-cta-demo *,.fd-btn *,.btn.ghost *,.btn.demo *,.band-btn *,.pc-out *,.sms-btn *,.sm-btn *,.pc-call *,.lo-btn *,.lc-btn *,.hmw-btn *,.dp-btn *,.pq-btn *{color:inherit!important}
</style>
</body>
</html>
