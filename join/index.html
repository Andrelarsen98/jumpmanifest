<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join your dropzone on Manifest</title>
<meta name="description" content="Join your dropzone on Manifest: ask the desk to add you." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/app-icon.png?v=3" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#050505; --muted:#71717B; --line:#ECECF1; --cloud:#EDEFF7; --purple:#6D42F5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Manrope,-apple-system,sans-serif; background:var(--cloud); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px 16px 40px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:28px; border:1px solid var(--line); padding:28px 24px; text-align:center; }
  .lockup { height:28px; width:auto; display:block; margin:0 auto 26px; }
  .logo { width:64px; height:64px; border-radius:16px; object-fit:cover; border:1px solid var(--line); margin:0 auto 14px; display:block; }
  .logo[hidden] { display:none; }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.5px; line-height:1.2; text-wrap:balance; }
  .lead { font-size:16px; line-height:1.55; color:var(--muted); margin-top:10px; }
  .hint { font-size:13px; line-height:1.5; color:var(--muted); margin-top:10px; }
  .btn { display:block; background:var(--purple); color:#fff; font-weight:600; font-size:16px; padding:16px; border-radius:999px; text-decoration:none; margin-top:20px; }
</style>
<script>try{if(sessionStorage.getItem("sh-in"))document.documentElement.classList.add("sh-seen");else sessionStorage.setItem("sh-in","1")}catch(e){}</script>
<style id="btn-black-head">/* 21 Oct 2026 (André): no purple buttons anywhere. Every filled button is the
   black price-card button: dark gradient, white text, soft ring. Shapes stay. */
.sh-cta-demo,.fd-btn,.btn.ghost,.btn.demo,.band-btn,.pc-out,.sms-btn,.sm-btn,.pc-call,.lo-btn,.lc-btn,.hmw-btn,.dp-btn,.btn.primary,.pq-btn,a.btn[href*="apps.apple.com"],a.btn[href="/get"]{background:linear-gradient(180deg,#2A2A2E,#050505)!important;color:#fff!important;border:0!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)!important;filter:none!important;transition:box-shadow .2s ease!important}
@media (hover:hover){.sh-cta-demo:hover,.fd-btn:hover,.btn.ghost:hover,.btn.demo:hover,.band-btn:hover,.pc-out:hover,.sms-btn:hover,.sm-btn:hover,.pc-call:hover,.lo-btn:hover,.lc-btn:hover,.hmw-btn:hover,.dp-btn:hover,.btn.primary:hover,.pq-btn:hover,a.btn[href*="apps.apple.com"]:hover,a.btn[href="/get"]:hover{background:linear-gradient(180deg,#3A3A3F,#0A0A0A)!important;color:#fff!important;transform:none!important}}
.sh-cta-demo *,.fd-btn *,.btn.ghost *,.btn.demo *,.band-btn *,.pc-out *,.sms-btn *,.sm-btn *,.pc-call *,.lo-btn *,.lc-btn *,.hmw-btn *,.dp-btn *,.pq-btn *{color:inherit!important}
/* 21 Oct 2026 flash fixes: no iOS grey tap box anywhere, the header slides in on the first page of a visit only, hover only on real mouse devices. */
html{-webkit-tap-highlight-color:transparent}
a,button,summary,label,input,select,textarea{-webkit-tap-highlight-color:transparent}
summary{-webkit-user-select:none;user-select:none}
html.sh-seen .sh.li-bar{animation:none!important;opacity:1!important;transform:none!important}
.sh-nav:has(.sh-dd.open) .sh-dd:not(.open) .sh-panel{transition:none}
.sh-cta-demo:focus-visible,.fd-btn:focus-visible,.btn.ghost:focus-visible,.btn.demo:focus-visible,.band-btn:focus-visible,.pc-out:focus-visible,.sms-btn:focus-visible,.sm-btn:focus-visible,.pc-call:focus-visible,.lo-btn:focus-visible,.lc-btn:focus-visible,.hmw-btn:focus-visible,.dp-btn:focus-visible,.btn.primary:focus-visible,.pq-btn:focus-visible,a.btn[href*="apps.apple.com"]:focus-visible,a.btn[href="/get"]:focus-visible{outline:2px solid #050505!important;outline-offset:3px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 3px #fff!important}
</style>
</head>
<body>
  <div class="card">
    <img class="lockup" src="/assets/manifest-lockup.svg?v=6" alt="Manifest" />
    <img class="logo" id="logo" alt="" hidden />
    <h1 id="title">Join your dropzone</h1>
    <p class="lead" id="lead">Ask the desk to add you.</p>
    <p class="hint" id="hint">Joining in the app with this code is not open yet.</p>
    <a class="btn" href="/get">Get Manifest</a>
  </div>
<script>
  var code = (location.pathname.split('/')[2] || new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  if (code) fetch('https://wkefdtglgbfprvfajrrw.supabase.co/rest/v1/rpc/desk_join_preview', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_bSZ85fokRcmDjIzYr7Q9mQ_w4dQ0b3b' },
    body: JSON.stringify({ p_code: code })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.name) { document.getElementById('lead').textContent = 'We could not find this code. Check it with the desk.'; document.getElementById('hint').style.display = 'none'; return; }
    document.getElementById('title').textContent = 'Join ' + d.name;
    document.title = 'Join ' + d.name + ' on Manifest';
    if (d.logo_url) { var l = document.getElementById('logo'); l.src = d.logo_url; l.hidden = false; }
    if (d.open === false) document.getElementById('lead').textContent = d.name + ' is not taking new members in the app right now. Ask the desk.';
  }).catch(function () {});
</script>

<style id="no-purple">/* 21 Oct 2026 (André): no purple on anything you can press, no purple ticks, no purple step dots.
   Ticks = app green #30D158. Press/active/dots = ink #050505, hover = #71717B (same as the header). */

/* 1. Button ring: lavender #E9E5FE -> neutral */
.sh-cta-demo,.fd-btn,.btn.ghost,.btn.demo,.band-btn,.pc-out,.sms-btn,.sm-btn,.pc-call,.lo-btn,.lc-btn,.hmw-btn,.dp-btn,.btn.primary,.pq-btn,a.btn[href*="apps.apple.com"],a.btn[href="/get"],.go{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)!important}

/* 2. Header: active-page underline + mobile menu current item */
.is-current > .sh-t::after{background:#050505!important}
.sh-macc.is-current > span,.sh-mlink.is-current .sh-t{color:#050505!important}

/* 3. Body links on help / support / privacy / terms (were purple text) */
main.doc a:not([class]),.sup-tracks .email a{color:#050505!important;text-decoration:underline!important;text-decoration-color:rgba(5,5,5,.3)!important;text-underline-offset:3px}
main.doc a:not([class]):hover,.sup-tracks .email a:hover{color:#71717B!important;text-decoration-color:currentColor!important}
.help-grid .hcard i{color:#050505!important}

/* 4. Link hovers that turned purple */
.faq-help a:hover,.faq-more a:hover,.hero-note a:hover,.hero-dz a:hover,.final-dz a:hover,#globe .dzg-more a:hover,#desk .desk-link:hover,.hmw-ctas a.hmw-link:hover,.hmw-row a.hmw-link:hover,.hmw-where .vis-pts a:hover,.hmw .vis .more a:hover,.wx-ctas a.wx-link:hover,.sms-toc a:hover{color:#71717B!important}
.sms-four a:hover{color:#fff!important}
.sms-toc a::before{color:#71717B!important}

#desk .btn:focus-visible,#desk .desk-link:focus-visible,.vpause:focus-visible,.mq-btn:focus-visible{outline-color:#050505!important}
input:focus{outline-color:#050505!important;border-color:#050505!important}

/* 6. Ticks -> app green */

.vs-yes,.pr-yes,svg.ic.yes,.vs-ic.yes{background:#30D158!important}

/* 7. Step dots / numbered steps */
.dp-rail li::before,.lc-rail li::before,.sm-rail li::before,.sms-rail li::before,.hmw-day > li::after,.hmw-day .a:not(:empty)::after{border-color:#050505!important}

.lo-steps li::before{color:#050505!important}
.ll-line .dot{border-color:#050505!important}
.ll-line::after{background:#050505!important}
.lc-ladder li:not(.hold) .d{border-color:#fff!important}
.lc-ladder::before{background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.2))!important}
ol.steps > li::before,.how-grid .n,.next li i{background:#F2F2F5!important;color:#050505!important}
.steps i.on{background:#050505!important;color:#fff!important}

/* 8. Things that look pressable: help-page button names, the illustrated Call pill */
.doc kbd{background:#F2F2F5!important;color:#050505!important}
span.go > svg{background:#050505!important}

.vs-new{border-color:#E4E4E7!important}
/* 21 Oct 2026 (André): plain small green checks, no filled circles. */
.pr-yes{width:18px!important;height:18px!important;border-radius:0!important;background:none!important;display:inline-flex!important;align-items:center;justify-content:center}.pr-yes svg{width:18px!important;height:18px!important;stroke:#30D158!important;stroke-width:2.4!important}
.pr-yes img{display:none!important}
.vs-yes{background:none!important;color:#30D158!important;width:20px!important;height:20px!important}
.vs-yes svg{width:16px!important;height:16px!important;stroke-width:2.6}
</style>
