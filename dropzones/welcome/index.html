<!doctype html>
<html lang="en">
<head>
<meta name="apple-itunes-app" content="app-id=6778510429" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to Manifest Desk</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=4" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@1&display=swap" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet" />
<!-- STEP 4, SET UP (9 Oct 2026): Stripe sends them here after paying. We ask
     desk-billing to confirm the payment, which creates their dropzone and an
     owner invite for their email, then point them at the desk. -->
<style>
  :root { --ink: #050505; --muted: #71717B; --line: #E7E7EC; --purple: #6D42F5; --pale: #F0ECFE; --green: #15803D; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Manrope", -apple-system, sans-serif; color: var(--ink); background: #F6F6F9; line-height: 1.5; }
  .top { background: #fff; border-bottom: 1px solid var(--line); }
  .top .in { max-width: 1120px; margin: 0 auto; padding: 18px 20px; }
  .top img { height: 28px; display: block; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 28px; padding: 36px; }
  h1 { font-family: "General Sans", sans-serif; font-weight: 550; letter-spacing: -0.028em; font-size: clamp(30px, 4vw, 42px); line-height: 1.1; margin: 0; }
  h1 em { font-style: normal; color: var(--purple); }
  p { color: var(--muted); font-size: 17px; }
  ol { padding-left: 20px; margin: 18px 0 0; }
  ol li { margin: 10px 0; font-size: 16px; }
  ol li b { color: var(--ink); }
  .go { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 26px; padding: 18px 24px; border-radius: 99px; background: var(--purple); color: #fff; font-size: 17px; font-weight: 700; text-decoration: none; box-shadow: 0 10px 30px rgba(109,66,245,.28); }
  .ok { display: inline-flex; align-items: center; gap: 8px; color: var(--green); background: #DCFCE7; border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .err { color: #DC2626; }
</style>
<style id="skip-css">/* REVIEW FIXES (16 Oct 2026, A02 A18 A19): skip link, one focus ring, 44 px footer links on phones. */
.skip { position: fixed; left: 16px; top: -120px; z-index: 100; display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; background: #fff; color: #050505 !important; border: 1.5px solid #050505; font: 700 15px/1 "Manrope", -apple-system, BlinkMacSystemFont, sans-serif; text-decoration: none !important; }
.skip:focus { top: 16px; }
:where(a, button, summary, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid #050505 !important; outline-offset: 3px !important; box-shadow: 0 0 0 3px #fff; }
@media (max-width: 767px) { footer.legal-foot nav a { display: inline-flex; align-items: center; min-height: 44px; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header class="top"><div class="in"><a href="/dropzones/"><img src="/assets/manifest-lockup.svg?v=5" alt="Manifest" /></a></div></header>
<main id="main">
  <div class="card" id="box">
    <h1>Finishing your set-up…</h1>
    <p>Confirming your payment with Stripe.</p>
  </div>
</main>

<!-- LEGAL FOOTER (André, 9 Oct: "have our terms always under"), like
     Softriver's: always at the bottom of the sign-up pages. No company name
     until Manifest Jump LLC exists. -->
<footer class="legal-foot">
  <div class="in">
    <span>© 2026 Manifest Jump LLC · Wyoming, USA · Dubai, UAE</span>
    <nav><a href="/terms/">Terms of service</a><a href="/privacy/">Privacy policy</a><a href="/support/">Support</a><a href="mailto:andre@manifestjump.com">Contact</a></nav>
  </div>
</footer>
<style>
  .legal-foot { background: #fff; border-top: 1px solid #E7E7EC; margin-top: 48px; }
  .legal-foot .in { max-width: 1120px; margin: 0 auto; padding: 22px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; font-size: 14px; color: #71717B; }
  .legal-foot nav { display: flex; gap: 22px; flex-wrap: wrap; }
  .legal-foot a { color: #71717B; text-decoration: none; }
  .legal-foot a:hover { color: #050505; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  body > main { flex: 1 0 auto; width: 100%; }
</style>
<script>
(function () {
  var s = new URLSearchParams(location.search).get('s'), box = document.getElementById('box');
  function fail(msg) { box.innerHTML = '<h1>Almost there</h1><p class="err">' + msg + '</p><p>If you paid, nothing is lost: email <a href="mailto:andre@manifestjump.com">andre@manifestjump.com</a> and we finish it with you.</p>'; }
  if (!s) { fail('We could not find your payment.'); return; }
  var tries = 0;
  (function confirm() {
    fetch('https://wkefdtglgbfprvfajrrw.supabase.co/functions/v1/desk-billing', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'confirm', session_id: s }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (x) {
        if (!x.ok) { if (x.status === 409 && tries++ < 6) return setTimeout(confirm, 2000); throw new Error(x.j.error || 'Something went wrong'); }
        try { sessionStorage.removeItem('desk.start'); } catch (e) {}
        var dz = x.j.dropzone, em = x.j.email;
        box.innerHTML = '<span class="ok">✓ Payment received</span><h1>Welcome, <em></em></h1>' +
          '<p>Your desk is ready. Here is what happens next:</p><ol>' +
          '<li><b>Sign in at desk.jumpmanifest.com</b> with <b class="em"></b>. You are the owner.</li>' +
          '<li><b>Add your aircraft and jump prices</b> under Settings.</li>' +
          '<li><b>Print your join poster</b> so your jumpers find you in the app.</li>' +
          '<li><b>We call you</b> to set up the rest together before your first load.</li></ol>' +
          '<a class="go" href="https://desk.jumpmanifest.com">Open the desk →</a>';
        box.querySelector('h1 em').textContent = dz;
        box.querySelector('.em').textContent = em;
      })
      .catch(function (e) { fail(e.message); });
  })();
})();
</script>
<script id="mailto-copy">
/* "Write to me" did nothing on Macs with no mail app set up (André, 16 Oct).
   Every email link still opens the mail app, and also copies the address and
   says so, so the visitor always has it. Links the demo form takes over are
   left alone. */
(function () {
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="mailto:"]');
    if (!a || e.defaultPrevented) return;
    var addr = decodeURIComponent(a.getAttribute('href').slice(7).split('?')[0]);
    var t = document.getElementById('mailto-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'mailto-toast'; t.setAttribute('role', 'status');
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:#050505;color:#fff;font:600 15px/20px Manrope,sans-serif;padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center;opacity:0;transition:opacity .2s';
      document.body.appendChild(t);
    }
    var show = function (msg) { t.textContent = msg; t.style.opacity = '1'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.opacity = '0'; }, 4000); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr).then(function () { show('Email copied: ' + addr); }, function () { show('Email: ' + addr); });
    } else show('Email: ' + addr);
  });
})();
</script>
</body>
</html>
